# Dependabot opens pull requests when the libraries this project uses release
# new versions, separately for backend/ and client/. Every PR runs both
# halves' type check, tests and build, plus the client's lint
# (.github/workflows/test-and-deploy-staging.yml) and gets a Netlify deploy
# preview; a person reviews and merges it (merging to staging deploys
# staging).
#
# PRs go to the default branch, staging, like every other change. That's why
# no target-branch is set: with one, Dependabot's security-fix PRs would ignore
# this file (the "deps" prefix, the directories), and only version updates
# would follow it.
version: 2
updates:
  # The backend's npm libraries (backend/package.json / package-lock.json)
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    # Wait a week after a release before suggesting it, so a bad or hacked
    # release is usually caught and withdrawn before it reaches us
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Minor and patch updates (meant to be safe) arrive together in one PR;
      # each major update (may need code changes) gets its own PR
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Node.js's type definitions must describe the Node version that runs
      # the code: 24 ("engines" in package.json, the workflows' node-version).
      # A newer major describes features Node 24 doesn't have, so TypeScript
      # would accept code that crashes. Move it together with Node itself.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # One TypeScript for both halves: the client's is held below 6.1 (see
      # its rule below), and code shared by both sides must compile the same
      # on each. Remove together with the client's rule.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  # The client's npm libraries (client/package.json / package-lock.json),
  # with the same rules
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # As in the backend: Node 24 builds the site (NODE_VERSION in
      # client/netlify.toml, the workflows' node-version)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The linter's TypeScript support (typescript-eslint) works only with
      # TypeScript below 6.1, and npm refuses to install a newer one next to
      # it, which would fail the whole minor-and-patch PR. Remove this (and
      # the backend's) once typescript-eslint supports newer versions.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  # The GitHub Actions the workflows use (checkout, setup-node, auth, QA Wolf)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
