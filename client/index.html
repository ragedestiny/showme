<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/book-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Show, don't tell: turn plain sentences into vivid descriptions"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Both fonts in one request: the browser waits for this stylesheet
         before drawing the page -->
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,500;1,500&family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap's styles come with the app's own stylesheet (imported in
         src/index.tsx), so no separate copy is loaded from a CDN -->
    <link rel="stylesheet" href="/styles.css" />
    <title>Show And Tell</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- Shown while the app's code downloads, until the app has drawn its
         first screen (App.tsx removes it): the same "Loading..." overlay the
         pages use, styled in styles.css. It fades in after 0.3 s, so a quick
         load never flashes it -->
    <div id="app-loading" role="status">
      <div class="app-loading-content">
        <div class="app-loading-spinner">
          <svg viewBox="25 25 50 50">
            <circle cx="50" cy="50" r="20" fill="none" stroke-width="2" stroke-miterlimit="10" />
          </svg>
        </div>
        Loading...
      </div>
    </div>
    <div id="root"></div>
    <!-- Vite starts building the app from here -->
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
